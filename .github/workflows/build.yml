name: Build

# Every push builds the phone app (universal APK plus one per CPU
# architecture) and the PC app (Mobile Claude Host for Windows and Linux).
#   - branch push -> "nightly" pre-release is updated
#   - tag v*      -> a real GitHub release
#   - Actions -> "Build" -> Run workflow with "release" = 0.2.0 -> release v0.2.0
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 0.1.0). Empty = just build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            echo "VERSION_NAME=${RELEASE_INPUT#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${RELEASE_INPUT#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          . "$GITHUB_ENV"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG:-}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Go/Tailscale part takes minutes to build; reuse it until it changes.
      - name: Restore embedded Tailscale
        id: tsbridge-cache
        uses: actions/cache/restore@v4
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/**', 'scripts/build-tsbridge.sh') }}

      - uses: actions/setup-go@v5
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum

      - name: Build embedded Tailscale (gomobile)
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./scripts/build-tsbridge.sh

      # Saved right away, so a later Gradle failure doesn't throw it away.
      - name: Save embedded Tailscale
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/tsbridge.aar
          key: ${{ steps.tsbridge-cache.outputs.cache-primary-key }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$f" "dist/MobileClaude-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  host:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: mobile-claude-host.exe
            out: MobileClaudeHost-windows-x64.exe
          - os: ubuntu-latest
            file: mobile-claude-host
            out: MobileClaudeHost-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and host/target: rebuilds take seconds once warm.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          key: ${{ matrix.os }}

      - name: Linux libraries (tray, dialogs, screen capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libegl-dev

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Build
        working-directory: host
        run: cargo build --release --locked

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "host/target/release/${{ matrix.file }}" "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ runner.os }}
          path: dist/*

  publish:
    needs: [apk, host]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.apk.outputs.version }}
      RELEASE_TAG: ${{ needs.apk.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Move nightly tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish nightly
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Mobile Claude nightly
          prerelease: true
          body: |
            Son derleme: `${{ env.VERSION_NAME }}` — ${{ github.sha }} (${{ github.ref_name }})

            **Telefon:** çoğu telefon için **MobileClaude-arm64-v8a.apk**, emin değilsen **MobileClaude-universal.apk**.
            **PC:** Windows için **MobileClaudeHost-windows-x64.exe** (çift tıkla, tepsiye yerleşir).
          files: dist/*

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Mobile Claude ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            **Telefon:** çoğu telefon için **MobileClaude-arm64-v8a.apk**, emin değilsen **MobileClaude-universal.apk**.
            **PC:** Windows için **MobileClaudeHost-windows-x64.exe** (çift tıkla, tepsiye yerleşir).
          files: dist/*
